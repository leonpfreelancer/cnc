# Cloudflare Worker cu fișiere statice. Build-ul din Cloudflare rulează: npx wrangler deploy
# IMPORTANT: „name” trebuie să fie exact numele Worker-ului din dashboard (Workers & Pages).
name = "cnc"
main = "src/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# Worker-ul vede toate cererile (pentru formular, sitemap, robots și adresele absolute din HTML).
run_worker_first = true

[observability]
enabled = true

# Opțional: păstrează cererile și în KV (și activează limita de 5 cereri/oră/IP).
#   npx wrangler kv namespace create CERERI   → pune id-ul aici și decomentează:
# [[kv_namespaces]]
# binding = "CERERI"
# id = "PUNE_AICI_ID_UL"

# Secretele NU se pun aici. Se adaugă în Cloudflare → Worker-ul tău → Settings → Variables and Secrets, tip „Secret”:
#   TELEGRAM_BOT_TOKEN
#   TELEGRAM_CHAT_ID
