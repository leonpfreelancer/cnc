name = "atelier-laser"
pages_build_output_dir = "public"
compatibility_date = "2024-12-18"

# Opțional: păstrează cererile și în Cloudflare KV (și activează limita de 5 cereri/oră/IP).
# Creează namespace-ul:  npx wrangler kv namespace create CERERI   și pune id-ul aici.
# [[kv_namespaces]]
# binding = "CERERI"
# id = "PUNE_AICI_ID_UL"

# Secretele NU se pun aici. Se setează în Cloudflare → Pages → Settings → Variables and Secrets:
#   TELEGRAM_BOT_TOKEN  (secret)
#   TELEGRAM_CHAT_ID    (secret)
